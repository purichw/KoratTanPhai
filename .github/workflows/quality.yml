name: Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      baseline_run: ${{ steps.scope.outputs.baseline_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Covers ordinary pushes and PR merge parents. Missing history runs full.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test scope and required-gate decisions
        run: node --test tests/ci/*.test.mjs
      - name: Select coverage with verified baseline
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  contracts:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only used in the isolated build exercised by Playwright network mocks.
      VITE_SUPABASE_URL: https://ktp-auth-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:model-inputs
      - run: npm run test:operations
      - run: node --test tests/admin-data/*.test.mjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:database
  built-browser:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # Keep the full built suite; build plus browser coverage can exceed 20 minutes.
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ktp-auth-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      VITE_OPERATIONAL_TELEMETRY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:protected
      - run: git diff --exit-code -- src/data/generated/
      - run: npm run test:e2e:built
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: built-browser-failures
          path: test-results/
          retention-days: 7
  database-browser:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # Browser coverage takes about 19 minutes before the protected build.
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ktp-auth-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:database
      - run: npm run build:protected
        env:
          VITE_DATA_BACKEND: supabase
          BUILD_OUT_DIR: tmp-snapshots/ci-database-build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: database-browser-failures
          path: test-results/
          retention-days: 7
  cms-browser:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ktp-auth-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      VITE_DATA_BACKEND: supabase
      VITE_REFERENCE_BACKEND: cms
      PLAYWRIGHT_REFERENCE_BACKEND: cms
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/admin-data/forecast-publication.test.mjs
        env:
          CMS_FULL_ARCHIVE_TEST: '1'
      - run: npm run build:protected
      - run: npm run test:e2e:built -- e2e/admin-data.spec.ts e2e/cms-references.spec.ts e2e/admin-auth.spec.ts e2e/admin-navigation.spec.ts e2e/admin-design.spec.ts e2e/admin-resource-detail.spec.ts e2e/admin-clarity.spec.ts e2e/admin-rev3-import.spec.ts e2e/admin-import-repair.spec.ts e2e/admin-resume.spec.ts e2e/page-loading-database.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cms-browser-failures
          path: test-results/
          retention-days: 7
  browser-compatibility:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # Slow Ubuntu mirrors can consume the old budget before browsers are installed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run test:e2e:compat
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compatibility-failures
          path: test-results/
          retention-days: 7
  regression:
    if: always()
    needs: [scope, contracts, built-browser, database-browser, cms-browser, browser-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the complete selected coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-regression-gate.mjs
